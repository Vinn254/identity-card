services:
  - type: web
    name: ueab-ims-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://nwydgwpcxlgseofmvbyy.supabase.co
      - key: SUPABASE_ANON_KEY
        fromSecret: supabase_anon_key
      - key: JWT_SECRET
        value: ueab_ims_super_secret_change_me_in_production
    healthCheckPath: /api/health
    autoDeploy: true